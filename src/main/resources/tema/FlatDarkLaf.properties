# Dark Stadium Slate - Fundamentos visuales Etapa 0 (FlatLaf 3.2.1)
# Solo redefine tokens base de superficies, bordes y tablas para mantener
# compatibilidad con el Look and Feel oscuro existente.

@background = #0D131A
@foreground = #F1F5F9
@accentColor = #10B981
@selectionBackground = #1E3A5F
@selectionForeground = #F1F5F9
@disabledForeground = #64748B

Component.arc = 6
Button.arc = 6
TextComponent.arc = 6
Component.borderColor = #2A374A
Component.focusColor = #10B981
Component.focusedBorderColor = #10B981

TextField.background = #1E293B
PasswordField.background = #1E293B
ComboBox.background = #1E293B
TextArea.background = #1E293B

Table.background = #131B26
Table.alternateRowColor = #182230
Table.gridColor = #2A374A
Table.showHorizontalLines = true
Table.showVerticalLines = false
Table.rowHeight = 28
Table.selectionBackground = #1E3A5F
Table.selectionForeground = #F1F5F9
TableHeader.background = #161F2C
TableHeader.foreground = #F1F5F9
TableHeader.height = 30
TableHeader.bottomSeparatorColor = #2A374A
